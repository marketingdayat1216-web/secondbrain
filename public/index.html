<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Brain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="brand-mark">🧠</div>
    <h1 id="login-title">Second Brain</h1>
    <p class="muted">Masuk dengan kode yang dikirim ke Telegram-mu.</p>
    <button id="send-code" class="btn primary wide">Kirim kode ke Telegram</button>
    <form id="code-form" class="stack" hidden>
      <label for="code-input" class="label">Kode 6 digit</label>
      <input id="code-input" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <button class="btn primary wide" type="submit">Masuk</button>
    </form>
    <p id="login-msg" class="msg"></p>
  </div>
</div>

<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M8 7c-2 1-2 4 0 5-2 1-2 4 0 5M16 7c2 1 2 4 0 5 2 1 2 4 0 5"/></svg></span><span class="brand-text"><b id="brand-name">Second Brain</b><small>Asisten pribadi</small></span></div>
    <nav id="nav">
      <div class="nav-label">Asisten</div>
      <a href="#/" data-route=""><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
      <a href="#/kantor" data-route="kantor"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg><span>Kantor 3D</span></a>
      <a href="#/tugas" data-route="tugas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span>Tugas</span></a>
      <a href="#/catatan" data-route="catatan"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M8 7c-2 1-2 4 0 5-2 1-2 4 0 5M16 7c2 1 2 4 0 5 2 1 2 4 0 5"/></svg><span>Second Brain</span></a>
      <a href="#/chat" data-route="chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg><span>Chat AI</span></a>
      <a href="#/profil" data-route="profil"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Profil &amp; Memori</span></a>
      <div class="nav-label">Marketing</div>
      <a href="#/riset" data-route="riset"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span>Riset Kompetitor</span></a>
      <div class="nav-label">Lainnya</div>
      <a href="#/sistem" data-route="sistem"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Sistem</span></a>
    </nav>
    <div class="sidebar-foot">
      <span id="who" class="muted small"></span>
      <button id="logout" class="btn ghost small">Keluar</button>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
