name: Deploy ke Cloudflare

# Jalan otomatis setiap ada perubahan di branch main, atau manual dari tab Actions → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Cek kode (bundling)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Buat sumber daya, deploy, dan sambungkan bot
        run: node scripts/deploy.mjs
        env:
          # Secrets (Settings → Secrets and variables → Actions → Secrets)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Variables (Settings → Secrets and variables → Actions → Variables)
          APP_NAME: ${{ vars.APP_NAME }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
          OWNER_USERNAME: ${{ vars.OWNER_USERNAME || 'day_dayTN' }}
          OWNER_CHAT_ID: ${{ vars.OWNER_CHAT_ID }}
          TIMEZONE_OFFSET: ${{ vars.TIMEZONE_OFFSET }}
          MODEL_FAST: ${{ vars.MODEL_FAST }}
          MODEL_SMART: ${{ vars.MODEL_SMART }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
